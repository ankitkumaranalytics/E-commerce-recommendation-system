[project]
name = "ecommerce-recommendation-system"
version = "1.0.0"
description = "Advanced AI-powered E-commerce Recommendation System with Hybrid ML Models"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.3",
    "pandas>=2.1.3",
    "scikit-learn>=1.3.2",
    "scipy>=1.11.4",
    "nltk>=3.8.1",
    "sentence-transformers>=2.2.2",
    "SQLAlchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.2",
    "aiofiles>=23.2.1",
    "redis>=5.0.1",
    "joblib>=1.3.2",
    "matplotlib>=3.8.2",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "gunicorn>=21.2.0",
    "psutil>=5.9.6",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "isort>=5.13.2",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

